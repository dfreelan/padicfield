[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padicfield"
version = "0.1.0"
description = "p-adic arithmetic and local-field numerics for exact valuation, Hensel lifting, and Teichmüller representatives"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "padicfield contributors" }]
keywords = [
    "p-adic",
    "local-fields",
    "number-theory",
    "hensel",
    "teichmuller",
    "valuation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
padicfield = "padicfield.cli:main"

[project.urls]
Homepage = "https://github.com/example/padicfield"
Documentation = "https://github.com/example/padicfield#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
padicfield = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["padicfield"]
branch = true
